<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>
        
        <div class="buttons">
            <button onclick="clearDisplay()" class="operator-btn">C</button>
            <button onclick="deleteLast()" class="operator-btn">DEL</button>
            <button onclick="appendValue('/')" class="operator-btn">÷</button>
            <button onclick="appendValue('*')" class="operator-btn">×</button>
        

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('-')" class="operator-btn">-</button>
            

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('+')" class="operator-btn">+</button>
            

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculate()" class="equal-btn">=</button>
        

            <button onclick="appendValue('0')" class="zero-btn">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script src="calculater.js"></script>
</body>
</html>
